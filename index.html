<!doctype html>
<html lang="en" class="is-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cove Studio — Creating with character</title>
    <meta
      name="description"
      content="Cove Studio is a marketing studio for modern brands: brand identity, websites, content creation, reels and social media management made in each brand's own voice."
    />
    <meta name="theme-color" content="#0A0A0B" />
    <meta property="og:title" content="Cove Studio — Creating with character" />
    <meta property="og:description" content="Brands, websites and content that sound like you. Made with character." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/img/favicon.png" />
    <link rel="preload" as="image" href="/img/cat-icon.webp" />
    <link rel="preload" as="image" href="/img/cove-studio.webp" />
    <!-- Critical paint: the white loader is up before any script or stylesheet,
         and nothing else shows until the page is ready to enter. -->
    <style>
      html, body { margin: 0; background: #0a0a0b; }
      .loader { position: fixed; inset: 0; z-index: 15; display: grid; place-items: center; background: #fff; }
      .loader__icon { width: 64px; height: auto; display: block; }
      html.is-loading .chrome, html.is-loading main { visibility: hidden; }
    </style>
  </head>
  <body>
    <div class="loader" aria-hidden="true">
      <img class="loader__icon" src="/img/cat-icon.webp" alt="" width="64" height="64" />
    </div>

    <canvas id="gl" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>

    <header class="chrome">
      <a class="chrome__logo" href="/" aria-label="Cove Studio, home">
        <img data-ink="img" src="/img/cat-icon.webp" alt="" width="54" height="54" />
      </a>

      <div class="chrome__badge" aria-hidden="true">
        <svg class="globe" viewBox="0 0 92 44" fill="none" stroke="currentColor" stroke-width="2">
          <ellipse class="globe__rim" cx="46" cy="22" rx="44" ry="20" />
          <line x1="2" y1="22" x2="90" y2="22" />
          <line class="globe__lat" x1="8" y1="12" x2="84" y2="12" />
          <line class="globe__lat" x1="8" y1="32" x2="84" y2="32" />
          <ellipse class="globe__mer" cx="46" cy="22" rx="0" ry="20" />
          <ellipse class="globe__mer" cx="46" cy="22" rx="0" ry="20" />
          <ellipse class="globe__mer" cx="46" cy="22" rx="0" ry="20" />
        </svg>
      </div>

      <nav class="chrome__nav" aria-label="Primary">
        <a class="pill" data-ink="pill" href="#works"><span class="pill__label" data-ink="text">Works</span></a>
        <a class="pill" data-ink="pill" href="#profile"><span class="pill__label" data-ink="text">Profile</span></a>
        <a class="pill" data-ink="pill" href="#contact"><span class="pill__label" data-ink="text">Contact</span></a>
      </nav>
    </header>

    <main>
      <section class="hero" id="top" aria-labelledby="hero-title">
        <h1 class="hero__title" id="hero-title">
          <span class="sr-only">Cove Studio — creating with character</span>
          <span class="hero__mark" aria-hidden="true">
            <img class="hero__wordmark" src="/img/cove-studio.webp" alt="" width="2172" height="724" />
          </span>
        </h1>

        <div class="hero__key" id="key-slot" aria-hidden="true"></div>

        <div class="hero__case" aria-hidden="true">
          <div class="hero__case-tilt">
            <img class="hero__case-img" src="/img/cd-poster.webp" alt="" width="480" height="480" />
            <!-- hovering the case spins the disc up and plays it; leaving winds it down -->
            <video class="hero__cd" muted loop playsinline preload="none" disablepictureinpicture></video>
          </div>
        </div>

        <div class="hero__cone" aria-hidden="true">
          <img src="/img/cone.webp" alt="" width="560" height="560" />
        </div>

        <ul class="hero__services" aria-label="What we do">
          <li data-ink="text">Brand identity</li>
          <li data-ink="text">Websites</li>
          <li data-ink="text">Content &amp; reels</li>
          <li data-ink="text">Social management</li>
        </ul>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
